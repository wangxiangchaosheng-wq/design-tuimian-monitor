name: Update 985 and 211 Design Push Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl official university sites
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python crawler.py --max-pages 18 --delay 1.3
      - name: Commit data changes
        run: |
          git config user.name "design-push-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: update 985 and 211 design push notices"
          git push
